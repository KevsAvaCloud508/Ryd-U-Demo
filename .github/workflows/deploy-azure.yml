name: Deploy Producción a Azure

on:
  push:
    branches: ["main"]

jobs:
  deploy-produccion:
    name: Despliegue en Servidor Azure
    runs-on: ubuntu-latest

    steps:
      - name: Conectar a Azure y Desplegar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}        
          username: ${{ secrets.USERNAME }}    
          key: ${{ secrets.SSH_KEY }}      
          script: |
            # 1. Entramos a la carpeta del proyecto en el servidor
            cd /home/${{ secrets.USERNAME }}/ryd-u
        
            # 2. Descargamos la última versión de la rama main
            git pull origin main
            
            # 3. Configuramos el secreto JWT desde GitHub Secrets
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" > .env
        
            # 4. Reconstruimos y levantamos los contenedores
            # AQUI ESTABA EL ERROR: Cambiamos "docker compose" a "docker-compose"
            docker-compose down
            docker-compose up -d --build
